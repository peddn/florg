[package]
name = "florg"
version = "0.1.0"
edition = "2024"
description = "Fachlehrer Organizer"
publish = false

[dependencies]
anyhow = "1.0.105"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.10", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1-rustls", "rustls-platform-verifier", "ring", "builder", "hostname"] }
rand = "0.10.4"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
